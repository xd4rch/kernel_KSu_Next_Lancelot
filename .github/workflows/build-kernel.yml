name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      select_device:
        description: 'Select device:'
        required: true
        type: choice
        options:
          - lancelot
          - merlin

jobs:
  build:
    name: Build SukiSU Ultra + KPM
    runs-on: ubuntu-22.04
    env:
      DEVICE: ${{ github.event.inputs.select_device }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "config-suki.env" ]]; then
            grep -v -E "^#|^[[:space:]]*$" "config-suki.env" | sed 's/ #.*//; s/#.*//' >> "$GITHUB_ENV"
          else
            echo "config-suki.env bulunamadı!"; exit 1
          fi

      - name: Setup build tools
        shell: bash
        run: |
          set -euo pipefail
          echo "BUILD_TIME=$(date '+%Y%m%d%H%M')" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential curl flex git git-lfs libelf-dev libssl-dev \
            lzop zip python3 python-is-python3 tar xz-utils libncurses5-dev
          mkdir -p "$GITHUB_WORKSPACE/kernel_workspace"

      - name: Download Proton Clang
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"
          wget -nv --timeout=120 -O clang.tar.gz "${{ env.CLANG_SOURCE }}"
          mkdir -p clang
          tar -C clang/ -zxvf clang.tar.gz --strip-components=1
          rm clang.tar.gz
          rm -f clang/bin/ld

      - name: Download LineageOS 20 Kernel Source
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"
          git clone --recursive "${{ env.KERNEL_SOURCE }}" -b "${{ env.KERNEL_SOURCE_BRANCH }}" android-kernel --depth=1

      - name: Apply KernelSU 4.14 Manual Hooks
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/android-kernel"

          # Non-GKI 4.14 sistem çağrı kancaları (fs/exec.c, fs/open.c)
          if [[ -f "$GITHUB_WORKSPACE/patches/KSU_HOOKS_PATCH.patch" ]]; then
            git apply "$GITHUB_WORKSPACE/patches/KSU_HOOKS_PATCH.patch" || true
            echo "KSU_HOOKS_PATCH.patch işlendi."
          fi

      - name: Setup SukiSU Ultra (SUSFS) Driver
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/android-kernel"

          # 1. SukiSU kurulum betiğini çalıştır
          curl -LSs "${{ env.KERNELSU_SETUP_SOURCE }}" | bash -s "${{ env.KERNELSU_TAG }}" || true

          # 2. drivers/kernelsu sembolik bağını kur
          if [ -d "KernelSU/kernel" ] && [ ! -d "drivers/kernelsu" ]; then
            ln -sfn ../KernelSU/kernel drivers/kernelsu
          fi

          # 3. Kconfig bağımlılık engellerini temizle
          for kcfg in drivers/kernelsu/Kconfig KernelSU/kernel/Kconfig; do
            if [ -f "$kcfg" ]; then
              sed -i '/depends on.*KPROBES/s/^/# /' "$kcfg" || true
              sed -i '/depends on.*OVERLAY_FS/s/^/# /' "$kcfg" || true
              echo "[OK] $kcfg bağımlılık engelleri kaldırıldı."
            fi
          done

          # 4. drivers/Kconfig içine SukiSU kaynağını bağla
          sed -i '/kernelsu\/Kconfig/d' drivers/Kconfig
          sed -i '/KernelSU\/Kconfig/d' drivers/Kconfig
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

          # 5. drivers/Makefile içine ekle
          if ! grep -q "kernelsu" drivers/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          fi

          # 6. Linux 4.14 Uyumluluk Yamaları (Global Enjeksiyonlar Dahil)
          python3 -c '
          import os, glob

          def get_unique_files(pattern):
              return {os.path.realpath(p) for p in glob.glob(pattern, recursive=True) if os.path.isfile(p)}

          # 6.1. GLOBAL: fallthrough makrosunu compiler.h dosyasına ekle
          comp_h = "include/linux/compiler.h"
          if os.path.exists(comp_h):
              with open(comp_h, "r") as f:
                  ch_c = f.read()
              if "fallthrough" not in ch_c:
                  with open(comp_h, "a") as f:
                      f.write("\n#ifndef fallthrough\n#define fallthrough do {} while (0)\n#endif\n")
                  print("[OK] Global fallthrough makrosu eklendi.")

          # 6.2. GLOBAL: TWA_RESUME tanımlarını task_work.h dosyasına ekle
          tw_h = "include/linux/task_work.h"
          if os.path.exists(tw_h):
              with open(tw_h, "r") as f:
                  tw_c = f.read()
              if "TWA_RESUME" not in tw_c:
                  tw_patch = (
                      "\n#ifndef TWA_RESUME\n"
                      "#define TWA_NONE 0\n"
                      "#define TWA_RESUME 1\n"
                      "#define TWA_SIGNAL 2\n"
                      "#endif\n"
                  )
                  with open(tw_h, "a") as f:
                      f.write(tw_patch)
                  print("[OK] Global task_work_add TWA_* makroları eklendi.")

          # syscall_hook.h içine typedef enjeksiyonu
          patch_header = (
              "#ifndef _SUKISU_SYSCALL_FN_T_\n"
              "#define _SUKISU_SYSCALL_FN_T_\n"
              "#include <linux/compiler.h>\n"
              "#include <linux/types.h>\n"
              "struct pt_regs;\n"
              "typedef long (*syscall_fn_t)(const struct pt_regs *);\n"
              "#endif /* _SUKISU_SYSCALL_FN_T_ */\n\n"
          )
          for h_path in get_unique_files("**/hook/syscall_hook.h"):
              with open(h_path, "r") as f:
                  content = f.read()
              if "_SUKISU_SYSCALL_FN_T_" not in content:
                  with open(h_path, "w") as f:
                      f.write(patch_header + content)

          asm_syscall = "arch/arm64/include/asm/syscall.h"
          if os.path.exists(asm_syscall):
              with open(asm_syscall, "r") as f:
                  ac = f.read()
              if "_SUKISU_SYSCALL_FN_T_" not in ac:
                  with open(asm_syscall, "w") as f:
                      f.write(patch_header + ac)

          # init.c içine MODULE_IMPORT_NS tanımı
          ns_patch = (
              "#ifndef MODULE_IMPORT_NS\n"
              "#define MODULE_IMPORT_NS(ns)\n"
              "#endif\n\n"
          )
          for i_path in get_unique_files("**/core/init.c"):
              with open(i_path, "r") as f:
                  content = f.read()
              if "MODULE_IMPORT_NS" not in content or "#define MODULE_IMPORT_NS" not in content:
                  with open(i_path, "w") as f:
                      f.write(ns_patch + content)

          # access_ok 2/3 parametre uyumluluğu
          uaccess = "arch/arm64/include/asm/uaccess.h"
          if os.path.exists(uaccess):
              with open(uaccess, "r") as f:
                  lines = f.readlines()
              with open(uaccess, "w") as f:
                  for line in lines:
                      if "#define access_ok" in line and "__range_ok" in line:
                          f.write("#define _ACCESS_OK_2(addr, size) __range_ok((unsigned long)(addr), size)\n")
                          f.write("#define _ACCESS_OK_3(type, addr, size) __range_ok((unsigned long)(addr), size)\n")
                          f.write("#define _ACCESS_OK_OVERLOAD(_1, _2, _3, NAME, ...) NAME\n")
                          f.write("#define access_ok(...) _ACCESS_OK_OVERLOAD(__VA_ARGS__, _ACCESS_OK_3, _ACCESS_OK_2)(__VA_ARGS__)\n")
                      else:
                          f.write(line)

          # include/linux/set_memory.h köprüsü
          if not os.path.exists("include/linux/set_memory.h"):
              with open("include/linux/set_memory.h", "w") as f:
                  f.write("#ifndef _LINUX_SET_MEMORY_H\n#define _LINUX_SET_MEMORY_H\n#include <asm/set_memory.h>\n#endif\n")

          # include/linux/pgtable.h köprüsü
          if not os.path.exists("include/linux/pgtable.h"):
              with open("include/linux/pgtable.h", "w") as f:
                  f.write("#ifndef _LINUX_PGTABLE_H\n#define _LINUX_PGTABLE_H\n#include <asm/pgtable.h>\n#endif\n")

          # include/uapi/linux/mount.h köprüsü
          os.makedirs("include/uapi/linux", exist_ok=True)
          if not os.path.exists("include/uapi/linux/mount.h"):
              with open("include/uapi/linux/mount.h", "w") as f:
                  f.write("#ifndef _UAPI_LINUX_MOUNT_H\n#define _UAPI_LINUX_MOUNT_H\n#include <linux/mount.h>\n#include <uapi/linux/fs.h>\n#endif\n")

          # sucompat.c ve util.h uyumluluğu
          compat_header = (
              "#include <linux/syscalls.h>\n"
              "#include <linux/uaccess.h>\n"
              "#ifndef strncpy_from_user_nofault\n"
              "#define strncpy_from_user_nofault strncpy_from_user\n"
              "#endif\n"
              "#ifndef ksys_close\n"
              "#define ksys_close sys_close\n"
              "#endif\n\n"
          )
          for su_file in get_unique_files("**/feature/sucompat.c"):
              with open(su_file, "r") as f:
                  sc = f.read()
              sc = sc.replace("strncpy_from_user_nofault", "strncpy_from_user")
              sc = sc.replace("ksys_close", "sys_close")
              with open(su_file, "w") as f:
                  f.write(compat_header + sc)

          for util_h in get_unique_files("**/include/util.h"):
              with open(util_h, "r") as f:
                  uc = f.read()
              uc = uc.replace("ksys_close", "sys_close")
              with open(util_h, "w") as f:
                  f.write(compat_header + uc)

          # lsm_hook.c stub
          lsm_stub = (
              "#include <linux/types.h>\n"
              "int ksu_lsm_hook_init(void) { return 0; }\n"
              "void ksu_lsm_hook_exit(void) {}\n"
          )
          for lsm_f in get_unique_files("**/hook/lsm_hook.c"):
              with open(lsm_f, "w") as f:
                  f.write(lsm_stub)

          # strncpy_from_user için uaccess.h enjeksiyonu
          all_c_files = get_unique_files("drivers/kernelsu/**/*.c") | get_unique_files("KernelSU/**/*.c")
          for c_path in all_c_files:
              with open(c_path, "r") as f:
                  code = f.read()
              if "strncpy_from_user" in code and "<linux/uaccess.h>" not in code:
                  with open(c_path, "w") as f:
                      f.write("#include <linux/uaccess.h>\n" + code)

          # patch_memory.c uyumluluğu
          pm_patch_header = (
              "#include <linux/uaccess.h>\n"
              "#include <asm/cacheflush.h>\n"
              "#include <asm/pgtable.h>\n"
              "#ifndef __pte_to_phys\n"
              "#define __pte_to_phys(pte) ((phys_addr_t)pte_pfn(pte) << PAGE_SHIFT)\n"
              "#endif\n"
              "#ifndef copy_to_kernel_nofault\n"
              "#define copy_to_kernel_nofault probe_kernel_write\n"
              "#endif\n\n"
          )
          for pm_file in get_unique_files("**/hook/arm64/patch_memory.c"):
              with open(pm_file, "r") as f:
                  pm_code = f.read()
              pm_code = pm_code.replace("__flush_icache_range", "flush_icache_range")
              pm_code = pm_code.replace("copy_to_kernel_nofault", "probe_kernel_write")
              with open(pm_file, "w") as f:
                  f.write(pm_patch_header + pm_code)

          # file_wrapper.c Linux 4.14 VFS uyumluluk köprüsü
          fw_header = (
              "#ifndef _SUKISU_FILE_WRAPPER_4_14_\n"
              "#define _SUKISU_FILE_WRAPPER_4_14_\n"
              "#include <linux/version.h>\n"
              "#include <linux/types.h>\n"
              "#include <linux/fs.h>\n"
              "#include <linux/file.h>\n"
              "#include <linux/dcache.h>\n"
              "#include <linux/mount.h>\n"
              "#include <linux/security.h>\n"
              "#include <linux/err.h>\n\n"
              "#ifndef __poll_t\n"
              "typedef unsigned int __poll_t;\n"
              "#define __poll_t __poll_t\n"
              "#endif\n\n"
              "#ifndef REMAP_FILE_DEDUP\n"
              "#define REMAP_FILE_DEDUP 0\n"
              "#endif\n\n"
              "static inline int security_inode_init_security_anon(struct inode *inode,\n"
              "                                                   const struct qstr *name,\n"
              "                                                   const struct inode *context_inode)\n"
              "{\n"
              "    (void)inode;\n"
              "    (void)name;\n"
              "    (void)context_inode;\n"
              "    return 0;\n"
              "}\n\n"
              "#ifndef selinux_inode\n"
              "#define selinux_inode(inode) ((struct inode_security_struct *)(inode)->i_security)\n"
              "#endif\n\n"
              "#if LINUX_VERSION_CODE < KERNEL_VERSION(4, 20, 0)\n"
              "static inline struct file *alloc_file_pseudo(struct inode *inode, struct vfsmount *mnt,\n"
              "                                             const char *name, int flags,\n"
              "                                             const struct file_operations *fops)\n"
              "{\n"
              "    struct qstr this = QSTR_INIT(name, strlen(name));\n"
              "    struct path path;\n"
              "    struct file *file;\n"
              "    path.dentry = d_alloc_pseudo(mnt->mnt_sb, &this);\n"
              "    if (!path.dentry) {\n"
              "        iput(inode);\n"
              "        return ERR_PTR(-ENOMEM);\n"
              "    }\n"
              "    path.mnt = mntget(mnt);\n"
              "    d_instantiate(path.dentry, inode);\n"
              "    file = alloc_file(&path, (fmode_t)flags, fops);\n"
              "    if (IS_ERR(file)) {\n"
              "        ihold(inode);\n"
              "        path_put(&path);\n"
              "    }\n"
              "    return file;\n"
              "}\n"
              "#endif\n"
              "#endif /* _SUKISU_FILE_WRAPPER_4_14_ */\n\n"
          )
          for fw_file in get_unique_files("**/infra/file_wrapper.c"):
              with open(fw_file, "r") as f:
                  content = f.read()
              if "_SUKISU_FILE_WRAPPER_4_14_" not in content:
                  lines = content.splitlines(True)
                  new_lines = []
                  skip_func = False
                  for line in lines:
                      if any(op in line for op in ["->ops.iopoll", "->ops.mmap_supported_flags", "->ops.remap_file_range", "->ops.fadvise"]):
                          new_lines.append("// [4.14 backport] " + line)
                      elif any(fn in line for fn in ["ksu_wrapper_iopoll(", "ksu_wrapper_remap_file_range(", "ksu_wrapper_fadvise("]):
                          new_lines.append("// [4.14 backport] modern fops omitted\n")
                          skip_func = True
                      elif skip_func:
                          if line.startswith("}"):
                              skip_func = False
                      else:
                          new_lines.append(line)
                  with open(fw_file, "w") as f:
                      f.write(fw_header + "".join(new_lines))

          # include/linux/poll.h ve event_queue uyumluluğu
          poll_h = "include/linux/poll.h"
          if os.path.exists(poll_h):
              with open(poll_h, "r") as f:
                  ph_c = f.read()
              if "__poll_t" not in ph_c:
                  ph_patch = (
                      "\n#include <uapi/linux/eventpoll.h>\n"
                      "#ifndef __poll_t\n"
                      "typedef unsigned int __poll_t;\n"
                      "#define __poll_t __poll_t\n"
                      "#endif\n"
                  )
                  with open(poll_h, "a") as f:
                      f.write(ph_patch)

          eq_header = (
              "#ifndef _SUKISU_EVENT_QUEUE_4_14_\n"
              "#define _SUKISU_EVENT_QUEUE_4_14_\n"
              "#include <linux/poll.h>\n"
              "#include <uapi/linux/eventpoll.h>\n"
              "#ifndef __poll_t\n"
              "typedef unsigned int __poll_t;\n"
              "#define __poll_t __poll_t\n"
              "#endif\n"
              "#ifndef EPOLLIN\n"
              "#define EPOLLIN 0x00000001\n"
              "#endif\n"
              "#ifndef EPOLLHUP\n"
              "#define EPOLLHUP 0x00000010\n"
              "#endif\n"
              "#ifndef EPOLLRDNORM\n"
              "#define EPOLLRDNORM 0x00000040\n"
              "#endif\n"
              "#endif /* _SUKISU_EVENT_QUEUE_4_14_ */\n\n"
          )
          for eq_file in get_unique_files("**/infra/event_queue.*"):
              with open(eq_file, "r") as f:
                  content = f.read()
              if "_SUKISU_EVENT_QUEUE_4_14_" not in content:
                  with open(eq_file, "w") as f:
                      f.write(eq_header + content)

          # seccomp_cache.c ve asm/seccomp.h uyumluluğu
          sc_header = (
              "#ifndef _SUKISU_SECCOMP_CACHE_4_14_\n"
              "#define _SUKISU_SECCOMP_CACHE_4_14_\n"
              "#include <asm/unistd.h>\n"
              "#ifndef SECCOMP_ARCH_NATIVE_NR\n"
              "#ifdef __NR_syscalls\n"
              "#define SECCOMP_ARCH_NATIVE_NR __NR_syscalls\n"
              "#else\n"
              "#define SECCOMP_ARCH_NATIVE_NR 512\n"
              "#endif\n"
              "#endif\n"
              "#ifndef SECCOMP_ARCH_COMPAT_NR\n"
              "#ifdef __NR_compat_syscalls\n"
              "#define SECCOMP_ARCH_COMPAT_NR __NR_compat_syscalls\n"
              "#else\n"
              "#define SECCOMP_ARCH_COMPAT_NR 400\n"
              "#endif\n"
              "#endif\n"
              "#endif /* _SUKISU_SECCOMP_CACHE_4_14_ */\n\n"
          )
          for sc_file in get_unique_files("**/infra/seccomp_cache.*"):
              with open(sc_file, "r") as f:
                  content = f.read()
              if "_SUKISU_SECCOMP_CACHE_4_14_" not in content:
                  with open(sc_file, "w") as f:
                      f.write(sc_header + content)

          asm_seccomp = "arch/arm64/include/asm/seccomp.h"
          if os.path.exists(asm_seccomp):
              with open(asm_seccomp, "r") as f:
                  asc = f.read()
              if "_SUKISU_SECCOMP_CACHE_4_14_" not in asc:
                  with open(asm_seccomp, "a") as f:
                      f.write("\n" + sc_header)

          # su_mount_ns.c uyumluluğu
          for mnt_file in get_unique_files("**/infra/su_mount_ns.c"):
              with open(mnt_file, "r") as f:
                  mc = f.read()
              mc = mc.replace("<uapi/linux/mount.h>", "<linux/mount.h>\n#include <uapi/linux/fs.h>\n#include <linux/syscalls.h>")
              mc = mc.replace("ksys_unshare", "sys_unshare")
              prefix_unshare = (
                  "#include <linux/syscalls.h>\n"
                  "#ifndef ksys_unshare\n"
                  "#define ksys_unshare sys_unshare\n"
                  "#endif\n\n"
              )
              with open(mnt_file, "w") as f:
                  f.write(prefix_unshare + mc)

          # manager/pkg_observer.c Linux 4.14 stub
          pkg_stub = (
              "#include <linux/types.h>\n"
              "int ksu_pkg_observer_init(void) { return 0; }\n"
              "void ksu_pkg_observer_exit(void) {}\n"
          )
          for pkg_f in get_unique_files("**/manager/pkg_observer.c"):
              with open(pkg_f, "w") as f:
                  f.write(pkg_stub)

          # 7. policy/allowlist.c ve put_task_struct kullanan tüm modüllerin uyumluluğu
          allowlist_header = (
              "#include <linux/sched/task.h>\n"
              "#include <linux/task_work.h>\n"
              "#include <linux/compiler.h>\n"
              "#ifndef TWA_RESUME\n"
              "#define TWA_RESUME 1\n"
              "#endif\n"
              "#ifndef fallthrough\n"
              "#define fallthrough do {} while (0)\n"
              "#endif\n\n"
          )
          for pol_f in get_unique_files("**/policy/*.c"):
              with open(pol_f, "r") as f:
                  pol_c = f.read()
              with open(pol_f, "w") as f:
                  f.write(allowlist_header + pol_c)
              print(f"[OK] policy modülü uyarlandı: {pol_f}")

          # SukiSU altındaki tüm dosyalarda put_task_struct varsa sched/task.h garantile
          for cf in all_c_files:
              with open(cf, "r") as f:
                  fc = f.read()
              if "put_task_struct" in fc and "<linux/sched/task.h>" not in fc:
                  with open(cf, "w") as f:
                      f.write("#include <linux/sched/task.h>\n" + fc)
          '

      - name: Setup Configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/android-kernel"

          DEFCONFIG_FILE="arch/arm64/configs/${DEVICE}_defconfig"

          # Bayrakları defconfig dosyasına temiz şekilde ekle
          {
            echo "CONFIG_OVERLAY_FS=y"
            echo "CONFIG_KALLSYMS=y"
            echo "CONFIG_KALLSYMS_ALL=y"
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_MANUAL_HOOK=y"
            echo "CONFIG_KPM=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
            echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
          } >> "$DEFCONFIG_FILE"

          # Defconfig dosyasını üret
          make ARCH=arm64 O=out "${DEVICE}_defconfig"

          # Clang uyumluluk bayrakları
          ./scripts/config --file out/.config --disable CONFIG_CC_STACKPROTECTOR_STRONG
          ./scripts/config --file out/.config --disable CONFIG_CC_WERROR

          # Yapılandırmayı senkronize et
          make ARCH=arm64 O=out olddefconfig

          # Doğrulama
          grep -E "^CONFIG_KSU=y" out/.config || (echo "HATA: CONFIG_KSU defconfig tarafından silindi!" && exit 1)

      - name: Build Raw Kernel Image
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/android-kernel"
          export PATH="$GITHUB_WORKSPACE/kernel_workspace/clang/bin:$PATH"

          # Ham Image derlemesi
          make -j"$(nproc --all)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image

      - name: Patch SukiSU Ultra KPM
        shell: bash
        run: |
          set -euo pipefail
          OUT_BOOT="$GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/arch/arm64/boot"
          if [[ "${{ env.KPM_SUPPORT }}" == "true" ]]; then
            mkdir -p "$GITHUB_WORKSPACE/kernel_workspace/SukiSU-Patch"
            cd "$GITHUB_WORKSPACE/kernel_workspace/SukiSU-Patch"

            wget -nv -O patch_linux "${{ env.KPM_URL }}" || wget -nv "${{ env.KPM_URL }}"
            chmod +x patch_linux
            cp "$OUT_BOOT/Image" .

            ./patch_linux

            if [[ -f oImage ]]; then
              echo "KPM injection successful!"
              gzip -c oImage > "$OUT_BOOT/Image.gz"
            else
              echo "Error: patch_linux oImage üretemedi!"
              exit 1
            fi
          else
            gzip -c "$OUT_BOOT/Image" > "$OUT_BOOT/Image.gz"
          fi

      - name: Prepare AnyKernel3
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"
          git clone "${{ env.ANYKERNEL3_SOURCE }}" -b "${{ env.ANYKERNEL3_BRANCH }}" --depth=1 AnyKernel3

          # Cihaz kontrol kilidini kaldır
          sed -i -E 's|^[# ]*do\.devicecheck=.*|do.devicecheck=0|g' AnyKernel3/anykernel.sh

          # Kesinleşen fiziksel boot adresi
          sed -i -E 's|^[# ]*block=.*|block=/dev/block/mmcblk0p34;|g' AnyKernel3/anykernel.sh
          sed -i -E 's|^[# ]*BLOCK=.*|BLOCK=/dev/block/mmcblk0p34;|g' AnyKernel3/anykernel.sh
          sed -i -E 's|^[# ]*is_slot_device=.*|is_slot_device=0;|g' AnyKernel3/anykernel.sh
          sed -i -E 's|^[# ]*IS_SLOT_DEVICE=.*|IS_SLOT_DEVICE=0;|g' AnyKernel3/anykernel.sh

          # Saf Image.gz dosyasını kopyala
          cp android-kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
          rm -rf AnyKernel3/.git* AnyKernel3/README.md

      - name: Upload SukiSU AnyKernel3 Package
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Ultra-Lancelot-LOS20-${{ env.BUILD_TIME }}
          path: kernel_workspace/AnyKernel3/*
