name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      select_device:
        description: 'Select device:'
        required: true
        type: choice
        options:
          - lancelot
          - merlin

jobs:
  build:
    name: Build SukiSU Ultra + KPM
    runs-on: ubuntu-22.04
    env:
      DEVICE: ${{ github.event.inputs.select_device }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "config-suki.env" ]]; then
            grep -v -E "^#|^[[:space:]]*$" "config-suki.env" | sed 's/ #.*//; s/#.*//' >> "$GITHUB_ENV"
          else
            echo "config-suki.env bulunamadı!"; exit 1
          fi

      - name: Setup build tools
        shell: bash
        run: |
          set -euo pipefail
          echo "BUILD_TIME=$(date '+%Y%m%d%H%M')" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential curl flex git git-lfs libelf-dev libssl-dev \
            lzop zip python3 python-is-python3 tar xz-utils libncurses5-dev
          mkdir -p "$GITHUB_WORKSPACE/kernel_workspace"

      - name: Download Proton Clang
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"
          wget -nv --timeout=120 -O clang.tar.gz "${{ env.CLANG_SOURCE }}"
          mkdir -p clang
          tar -C clang/ -zxvf clang.tar.gz --strip-components=1
          rm clang.tar.gz
          rm -f clang/bin/ld

      - name: Download LineageOS 20 Kernel Source
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"
          git clone --recursive "${{ env.KERNEL_SOURCE }}" -b "${{ env.KERNEL_SOURCE_BRANCH }}" android-kernel --depth=1

      - name: Apply KernelSU 4.14 Manual Hooks
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/android-kernel"

          if [[ -f "$GITHUB_WORKSPACE/patches/KSU_HOOKS_PATCH.patch" ]]; then
            git apply --whitespace=nowarn "$GITHUB_WORKSPACE/patches/KSU_HOOKS_PATCH.patch" || {
              patch -p1 < "$GITHUB_WORKSPACE/patches/KSU_HOOKS_PATCH.patch" || true
            }
            echo "[OK] KSU_HOOKS_PATCH.patch uygulandı."
          fi

      - name: Setup SukiSU Source & Core Headers
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/android-kernel"

          curl -LSs "${{ env.KERNELSU_SETUP_SOURCE }}" | bash -s "${{ env.KERNELSU_TAG }}" || true

          if [ -d "KernelSU/kernel" ] && [ ! -d "drivers/kernelsu" ]; then
            ln -sfn ../KernelSU/kernel drivers/kernelsu
          fi

          for kcfg in drivers/kernelsu/Kconfig KernelSU/kernel/Kconfig; do
            if [ -f "$kcfg" ]; then
              sed -i '/depends on.*KPROBES/s/^/# /' "$kcfg" || true
              sed -i '/depends on.*OVERLAY_FS/s/^/# /' "$kcfg" || true
              echo "[OK] $kcfg bağımlılık engelleri kaldırıldı."
            fi
          done

          sed -i '/kernelsu\/Kconfig/d' drivers/Kconfig
          sed -i '/KernelSU\/Kconfig/d' drivers/Kconfig
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

          if ! grep -q "kernelsu" drivers/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          fi

          cat << 'EOF' > patch_core_headers.py
          import os

          comp_h = "include/linux/compiler.h"
          if os.path.exists(comp_h):
              with open(comp_h, "r") as f: c = f.read()
              if "fallthrough" not in c:
                  with open(comp_h, "a") as f:
                      f.write("\n#ifndef fallthrough\n#define fallthrough do {} while (0)\n#endif\n")

          tw_h = "include/linux/task_work.h"
          if os.path.exists(tw_h):
              with open(tw_h, "r") as f: c = f.read()
              if "TWA_RESUME" not in c:
                  with open(tw_h, "a") as f:
                      f.write("\n#ifndef TWA_RESUME\n#define TWA_NONE 0\n#define TWA_RESUME 1\n#define TWA_SIGNAL 2\n#endif\n")

          uacc_global = "include/linux/uaccess.h"
          if os.path.exists(uacc_global):
              with open(uacc_global, "r") as f: c = f.read()
              if "copy_from_user_nofault" not in c:
                  defs = (
                      "\n#ifndef copy_from_user_nofault\n"
                      "#define copy_from_user_nofault(dst, src, size) copy_from_user(dst, (const void __user *)(src), size)\n"
                      "#endif\n"
                      "#ifndef copy_to_user_nofault\n"
                      "#define copy_to_user_nofault(dst, src, size) copy_to_user((void __user *)(dst), src, size)\n"
                      "#endif\n"
                      "#ifndef strncpy_from_user_nofault\n"
                      "#define strncpy_from_user_nofault(dst, src, size) strncpy_from_user(dst, (const char __user *)(src), size)\n"
                      "#endif\n"
                  )
                  with open(uacc_global, "a") as f: f.write(defs)

          uaccess = "arch/arm64/include/asm/uaccess.h"
          if os.path.exists(uaccess):
              with open(uaccess, "r") as f: lines = f.readlines()
              with open(uaccess, "w") as f:
                  for line in lines:
                      if "#define access_ok" in line and "__range_ok" in line:
                          f.write("#define _ACCESS_OK_2(addr, size) __range_ok((unsigned long)(addr), size)\n")
                          f.write("#define _ACCESS_OK_3(type, addr, size) __range_ok((unsigned long)(addr), size)\n")
                          f.write("#define _ACCESS_OK_OVERLOAD(_1, _2, _3, NAME, ...) NAME\n")
                          f.write("#define access_ok(...) _ACCESS_OK_OVERLOAD(__VA_ARGS__, _ACCESS_OK_3, _ACCESS_OK_2)(__VA_ARGS__)\n")
                      else:
                          f.write(line)

          sh_map = {
              "include/linux/set_memory.h": "#ifndef _LINUX_SET_MEMORY_H\n#define _LINUX_SET_MEMORY_H\n#include <asm/set_memory.h>\n#endif\n",
              "include/linux/pgtable.h": "#ifndef _LINUX_PGTABLE_H\n#define _LINUX_PGTABLE_H\n#include <asm/pgtable.h>\n#endif\n",
              "include/uapi/linux/mount.h": "#ifndef _UAPI_LINUX_MOUNT_H\n#define _UAPI_LINUX_MOUNT_H\n#include <linux/mount.h>\n#include <uapi/linux/fs.h>\n#endif\n",
              "include/linux/minmax.h": "#ifndef _LINUX_MINMAX_H\n#define _LINUX_MINMAX_H\n#include <linux/kernel.h>\n#endif\n",
              "include/vdso/datapage.h": "#ifndef _VDSO_DATAPAGE_H\n#define _VDSO_DATAPAGE_H\n#endif\n"
          }
          for p, h in sh_map.items():
              os.makedirs(os.path.dirname(p), exist_ok=True)
              if not os.path.exists(p):
                  with open(p, "w") as f: f.write(h)
          EOF
          python3 patch_core_headers.py

      - name: Apply SukiSU 4.14 Native Sucompat & Secure Cryptographic Bridge
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/android-kernel"

          cat << 'EOF' > patch_sukisu_compat.py
          import os, glob, re

          def get_files(pattern):
              return {os.path.realpath(p) for p in glob.glob(pattern, recursive=True) if os.path.isfile(p)}

          fn_t = (
              "#ifndef _SUKISU_SYSCALL_FN_T_\n#define _SUKISU_SYSCALL_FN_T_\n"
              "#include <linux/compiler.h>\n#include <linux/types.h>\nstruct pt_regs;\n"
              "typedef long (*syscall_fn_t)(const struct pt_regs *);\n#endif\n\n"
          )
          for h in get_files("**/syscall_hook.h") | get_files("arch/arm64/include/asm/syscall.h"):
              with open(h, "r") as f: c = f.read()
              if "_SUKISU_SYSCALL_FN_T_" not in c:
                  with open(h, "w") as f: f.write(fn_t + c)

          for ic in get_files("**/core/init.c"):
              with open(ic, "r") as f: c = f.read()
              if "MODULE_IMPORT_NS" not in c or "#define MODULE_IMPORT_NS" not in c:
                  with open(ic, "w") as f: f.write("#ifndef MODULE_IMPORT_NS\n#define MODULE_IMPORT_NS(ns)\n#endif\n\n" + c)

          pm_h = "#include <linux/uaccess.h>\n#include <asm/cacheflush.h>\n#include <asm/pgtable.h>\n#ifndef __pte_to_phys\n#define __pte_to_phys(pte) ((phys_addr_t)pte_pfn(pte) << PAGE_SHIFT)\n#endif\n#ifndef copy_to_kernel_nofault\n#define copy_to_kernel_nofault probe_kernel_write\n#endif\n\n"
          for pm in get_files("**/patch_memory.c"):
              with open(pm, "r") as f: c = f.read()
              c = c.replace("__flush_icache_range", "flush_icache_range").replace("copy_to_kernel_nofault", "probe_kernel_write")
              with open(pm, "w") as f: f.write(pm_h + c)

          fw_h = (
              "#ifndef _SUKISU_FILE_WRAPPER_4_14_\n#define _SUKISU_FILE_WRAPPER_4_14_\n"
              "#include <linux/version.h>\n#include <linux/fs.h>\n#include <linux/file.h>\n"
              "#include <linux/dcache.h>\n#include <linux/mount.h>\n#include <linux/security.h>\n#include <linux/err.h>\n"
              "typedef unsigned int __poll_t;\n#define REMAP_FILE_DEDUP 0\n"
              "static inline int security_inode_init_security_anon(struct inode *i, const struct qstr *n, const struct inode *c) { return 0; }\n"
              "#define selinux_inode(i) ((struct inode_security_struct *)(i)->i_security)\n"
              "static inline struct file *alloc_file_pseudo(struct inode *i, struct vfsmount *m, const char *n, int f, const struct file_operations *fops) {\n"
              "    struct qstr s = QSTR_INIT(n, strlen(n)); struct path p = { .dentry = d_alloc_pseudo(m->mnt_sb, &s), .mnt = mntget(m) };\n"
              "    if (!p.dentry) { iput(i); return ERR_PTR(-ENOMEM); }\n"
              "    d_instantiate(p.dentry, i); return alloc_file(&p, (fmode_t)f, fops);\n"
              "}\n#endif\n\n"
          )
          for fw in get_files("**/infra/file_wrapper.c"):
              with open(fw, "r") as f: lines = f.readlines()
              out, skip = [], False
              for l in lines:
                  if any(x in l for x in ["->ops.iopoll", "->ops.mmap_supported_flags", "->ops.remap_file_range", "->ops.fadvise"]): out.append("// " + l)
                  elif any(x in l for x in ["ksu_wrapper_iopoll(", "ksu_wrapper_remap_file_range(", "ksu_wrapper_fadvise("]): skip = True
                  elif skip:
                      if l.startswith("}"): skip = False
                  else: out.append(l)
              with open(fw, "w") as f: f.write(fw_h + "".join(out))

          eq_head = (
              "#ifndef _SUKISU_EQ_FIX_\n#define _SUKISU_EQ_FIX_\n"
              "#include <linux/poll.h>\n#include <uapi/linux/eventpoll.h>\n"
              "typedef unsigned int __poll_t;\n"
              "#ifndef EPOLLIN\n#define EPOLLIN 0x00000001\n#endif\n"
              "#ifndef EPOLLHUP\n#define EPOLLHUP 0x00000010\n#endif\n"
              "#ifndef EPOLLRDNORM\n#define EPOLLRDNORM 0x00000040\n#endif\n"
              "#endif /* _SUKISU_EQ_FIX_ */\n\n"
          )
          for eq in get_files("**/infra/event_queue.*"):
              with open(eq, "r") as f: c = f.read()
              if "_SUKISU_EQ_FIX_" not in c:
                  with open(eq, "w") as f: f.write(eq_head + c)

          for sc in get_files("**/infra/seccomp_cache.*"):
              with open(sc, "r") as f: c = f.read()
              if "SECCOMP_ARCH_NATIVE_NR" not in c:
                  with open(sc, "w") as f: f.write("#include <asm/unistd.h>\n#ifndef SECCOMP_ARCH_NATIVE_NR\n#define SECCOMP_ARCH_NATIVE_NR __NR_syscalls\n#endif\n" + c)

          all_files = get_files("drivers/kernelsu/**/*.[ch]") | get_files("KernelSU/**/*.[ch]")
          sched_b = "#include <linux/sched.h>\n#include <linux/sched/task.h>\n#include <linux/sched/signal.h>\n#include <linux/init_task.h>\nextern rwlock_t tasklist_lock;\nextern struct task_struct init_task;\n\n"
          for cf in all_files:
              with open(cf, "r") as f: c = f.read()
              c = c.replace("copy_from_user_nofault", "copy_from_user").replace("copy_to_user_nofault", "copy_to_user").replace("strncpy_from_user_nofault", "strncpy_from_user")
              c = c.replace("<linux/minmax.h>", "<linux/kernel.h>")
              c = re.sub(r'.*filter_count.*', '// [4.14 seccomp]', c)
              if "ksys_close" in c:
                  c = "#include <linux/syscalls.h>\n" + c.replace("ksys_close", "sys_close")
              if any(k in c for k in ["strncpy_from_user", "copy_from_user", "copy_to_user"]) and "<linux/uaccess.h>" not in c:
                  c = "#include <linux/uaccess.h>\n" + c
              if "put_task_struct" in c and "<linux/sched/task.h>" not in c:
                  c = "#include <linux/sched/task.h>\n" + c
              if ("tasklist_lock" in c or "init_task" in c) and "extern rwlock_t tasklist_lock" not in c:
                  c = sched_b + c
              with open(cf, "w") as f: f.write(c)

          # perm.c dosyasını eksik tüm sembolleriyle birlikte güvenli biçimde tanımla
          perm_code = (
              "#include <linux/fs.h>\n"
              "#include <linux/cred.h>\n"
              "#include <linux/types.h>\n\n"
              "extern unsigned int ksu_manager_appid;\n\n"
              "bool ksu_is_manager(void) {\n"
              "    uid_t uid = current_uid().val;\n"
              "    if (uid == 0) return true;\n"
              "    if (ksu_manager_appid != 0 && (uid % 100000) == ksu_manager_appid) return true;\n"
              "    return false;\n"
              "}\n\n"
              "bool always_allow(struct file *filp, unsigned int cmd) {\n"
              "    return true;\n"
              "}\n\n"
              "bool only_root(struct file *filp, unsigned int cmd) {\n"
              "    return current_uid().val == 0;\n"
              "}\n\n"
              "bool only_manager(struct file *filp, unsigned int cmd) {\n"
              "    return ksu_is_manager();\n"
              "}\n\n"
              "bool manager_or_root(struct file *filp, unsigned int cmd) {\n"
              "    return current_uid().val == 0 || ksu_is_manager();\n"
              "}\n\n"
              "bool allowed_for_su(struct file *filp, unsigned int cmd) {\n"
              "    return current_uid().val == 0 || ksu_is_manager();\n"
              "}\n\n"
              "bool ksu_supercall_check_perm(struct file *filp, unsigned int cmd) {\n"
              "    return manager_or_root(filp, cmd);\n"
              "}\n"
          )
          for pf in get_files("**/supercall/perm.c"):
              with open(pf, "w") as f: f.write(perm_code)
              print(f"[OK] perm.c sembol tablosu eksiksiz kuruldu: {pf}")

          # kernel/seccomp.c içinde SukiSU süperçağrısı ve resmi yönetici için baypas
          seccomp_c = "kernel/seccomp.c"
          if os.path.exists(seccomp_c):
              with open(seccomp_c, "r") as f: sc = f.read()
              if "ksu_seccomp_supercall_bypass" not in sc:
                  top_includes = "#include <linux/cred.h>\n#include <asm/ptrace.h>\n"
                  hook_sec = (
                      "\n#if defined(CONFIG_KSU)\n"
                      "    /* [ksu_seccomp_supercall_bypass] */\n"
                      "    extern unsigned int ksu_manager_appid;\n"
                      "    if (ksu_manager_appid != 0 && (current_uid().val % 100000) == ksu_manager_appid) {\n"
                      "        return 0;\n"
                      "    }\n"
                      "    {\n"
                      "        struct pt_regs *regs = task_pt_regs(current);\n"
                      "        if (regs && (unsigned int)regs->regs[0] == 0xdeadbeef && (unsigned int)regs->regs[1] == 0xcafebabe) {\n"
                      "            return 0;\n"
                      "        }\n"
                      "    }\n"
                      "#endif\n"
                  )
                  pos = sc.find("__secure_computing(")
                  if pos != -1:
                      b_pos = sc.find("{", pos)
                      if b_pos != -1:
                          sc = top_includes + sc[:b_pos+1] + hook_sec + sc[b_pos+1:]
                          with open(seccomp_c, "w") as f: f.write(sc)
                          print("[OK] kernel/seccomp.c içine SukiSU seccomp baypası yerleştirildi!")

          seccomp_stub = (
              "\n/* [4.14 seccomp bridge] */\n"
              "void seccomp_filter_release(struct task_struct *tsk) {}\n"
          )
          for ap in get_files("**/policy/app_profile.c"):
              with open(ap, "r") as f: c = f.read()
              if "void seccomp_filter_release(struct task_struct *tsk) {}" not in c:
                  with open(ap, "a") as f: f.write(seccomp_stub)

          # 4.14 Yerel Sucompat Motoru
          manual_hook_bridge = (
              "\n/* --- 4.14 Native Working Sucompat Engine --- */\n"
              "#include <linux/fs.h>\n"
              "#include <linux/file.h>\n"
              "#include <linux/binfmts.h>\n"
              "#include <linux/sched.h>\n"
              "#include <linux/uaccess.h>\n"
              "#include <linux/string.h>\n\n"
              "static inline bool ksu_is_su_path(const char __user *user_path) {\n"
              "    char buf[32];\n"
              "    long len;\n"
              "    if (!current->mm || uaccess_kernel() || !user_path) return false;\n"
              "    if (!access_ok(VERIFY_READ, user_path, 1)) return false;\n"
              "    len = strncpy_from_user(buf, user_path, sizeof(buf));\n"
              "    if (len <= 0) return false;\n"
              "    buf[sizeof(buf) - 1] = '\\0';\n"
              "    return (strcmp(buf, \"/system/bin/su\") == 0 || strcmp(buf, \"/system/xbin/su\") == 0 || strcmp(buf, \"su\") == 0);\n"
              "}\n\n"
              "int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags) {\n"
              "    if (filename_ptr && *filename_ptr && (*filename_ptr)->name) {\n"
              "        const char *name = (*filename_ptr)->name;\n"
              "        ksu_handle_execveat_ksud(name, (struct user_arg_ptr *)argv);\n"
              "        if (current->mm && !uaccess_kernel()) {\n"
              "            if (strcmp(name, \"/system/bin/su\") == 0 || strcmp(name, \"/system/xbin/su\") == 0) {\n"
              "                struct filename *su_name = getname_kernel(\"/data/adb/ksu/bin/su\");\n"
              "                if (!IS_ERR(su_name)) {\n"
              "                    putname(*filename_ptr);\n"
              "                    *filename_ptr = su_name;\n"
              "                }\n"
              "            }\n"
              "        }\n"
              "    }\n"
              "    return 0;\n"
              "}\n\n"
              "int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags) {\n"
              "    if (filename_user && ksu_is_su_path(*filename_user)) {\n"
              "        return 1;\n"
              "    }\n"
              "    return 0;\n"
              "}\n\n"
              "int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags) {\n"
              "    if (filename_user && ksu_is_su_path(*filename_user)) {\n"
              "        return 1;\n"
              "    }\n"
              "    return 0;\n"
              "}\n\n"
              "int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos_ptr) {\n"
              "    return 0;\n"
              "}\n\n"
              "int ksu_handle_devpts(struct inode *inode) {\n"
              "    return 0;\n"
              "}\n"
          )
          for ksud_f in get_files("**/runtime/ksud_integration.c"):
              with open(ksud_f, "r") as f: c = f.read()
              if "ksu_handle_execveat(" not in c:
                  with open(ksud_f, "a") as f: f.write(manual_hook_bridge)
                  print(f"[OK] 4.14 Yerel Sucompat Motoru eklendi: {ksud_f}")

          sel_head = "struct task_security_struct;\nstruct inode_security_struct;\nstruct file_security_struct;\n#ifndef selinux_cred\n#define selinux_cred(c) ((struct task_security_struct *)(c)->security)\n#endif\n#ifndef selinux_inode\n#define selinux_inode(i) ((struct inode_security_struct *)(i)->i_security)\n#endif\n"
          for sf in get_files("**/selinux/selinux.c"):
              with open(sf, "r") as f: c = f.read()
              with open(sf, "w") as f: f.write(sel_head + c)

          syscall_hook_stub = (
              "void *ksu_syscall_table[512] = { 0 };\n\n"
              "int ksu_syscall_hook_init(void) { return 0; }\n"
              "void ksu_syscall_hook_exit(void) {}\n"
              "void ksu_stop_ksud_execve_hook(void) {}\n"
              "int ksu_syscall_table_hook(int nr, void *hook_fn, void **orig_fn) { return 0; }\n"
              "int ksu_syscall_table_unhook(int nr) { return 0; }\n"
          )

          stub_dict = {
              "**/lsm_hook.c": "int ksu_lsm_hook_init(void){return 0;}\nvoid ksu_lsm_hook_exit(void){}\n",
              "**/syscall_hook.c": syscall_hook_stub,
              "**/syscall_hook_manager.c": "int ksu_syscall_hook_manager_init(void){return 0;}\nvoid ksu_syscall_hook_manager_exit(void){}\n",
              "**/syscall_event_bridge.c": "int ksu_syscall_event_bridge_init(void){return 0;}\nvoid ksu_syscall_event_bridge_exit(void){}\n",
              "**/setuid_hook.c": "int ksu_setuid_hook_init(void){return 0;}\nvoid ksu_setuid_hook_exit(void){}\n",
              "**/pkg_observer.c": "int ksu_observer_init(void){return 0;}\nvoid ksu_observer_exit(void){}\nint ksu_pkg_observer_init(void){return 0;}\nvoid ksu_pkg_observer_exit(void){}\n",
              "**/rules.c": "int apply_kernelsu_rules(void){return 0;}\nint ksu_load_rules(void){return 0;}\n",
              "**/sepolicy.c": "struct selinux_policy;\nstruct selinux_policy *ksu_dup_sepolicy(struct selinux_policy *o){return (void*)0;}\nint handle_sepolicy(unsigned long arg){return 0;}\n",
              "**/selinux_hide.c": "int ksu_selinux_hide_init(void){return 0;}\nvoid ksu_selinux_hide_exit(void){}\nbool ksu_is_selinux_hide_enabled(void){return false;}\nint ksu_set_selinux_hide(bool e){return 0;}\nint ksu_get_selinux_hide(void){return 0;}\nvoid ksu_selinux_hide_handle_post_fs_data(void){}\nvoid ksu_selinux_hide_drop_backup_if_unused(void){}\nvoid ksu_selinux_hide_handle_second_stage(void){}\n",
              "**/cpu_spoof.c": "int ksu_cpu_spoof_init(void){return 0;}\nvoid ksu_cpu_spoof_exit(void){}\nbool ksu_is_cpu_spoof_enabled(void){return false;}\nint ksu_set_cpu_spoof(bool e){return 0;}\nint ksu_get_cpu_spoof(void){return 0;}\nint ksu_set_spoof_cpu(bool e){return 0;}\n",
              "**/infra/su_mount_ns.c": "int ksu_su_mount_ns_init(void){return 0;}\nvoid ksu_su_mount_ns_exit(void){}\nint setup_mount_ns(void){return 0;}\n",
              "**/feature/sucompat.c": "int ksu_sucompat_init(void){return 0;}\nvoid ksu_sucompat_exit(void){}\n"
          }
          stub_header = "#include <linux/types.h>\n#include <linux/stddef.h>\n\n"
          for pat, code in stub_dict.items():
              for target in get_files(pat):
                  with open(target, "w") as f: f.write(stub_header + code)
                  print(f"[OK] Stub uygulandı: {target}")

          # Kriptografik İmza Teyitli Sıfır-Taviz Supercall Köprüsü
          bridge_code = (
              "\n/* --- SukiSU Zero-Trust Cryptographic Supercall Reboot Bridge --- */\n"
              "#include <linux/fs.h>\n"
              "#include <linux/file.h>\n"
              "#include <linux/anon_inodes.h>\n"
              "#include <linux/err.h>\n"
              "#include <linux/uaccess.h>\n"
              "#include <linux/mm.h>\n"
              "#include <linux/sched/mm.h>\n"
              "#include <linux/dcache.h>\n"
              "#include <linux/gfp.h>\n"
              "#include <linux/cred.h>\n\n"
              "extern bool is_manager_apk(char *path);\n"
              "extern unsigned int ksu_manager_appid;\n\n"
              "static bool ksu_verify_caller_signature(uid_t uid) {\n"
              "    struct mm_struct *mm = current->mm;\n"
              "    struct vm_area_struct *vma;\n"
              "    char *page_buf;\n"
              "    char apk_path[512];\n"
              "    bool verified = false;\n"
              "    if (!mm) return false;\n"
              "    page_buf = (char *)__get_free_page(GFP_KERNEL);\n"
              "    if (!page_buf) return false;\n"
              "    down_read(&mm->mmap_sem);\n"
              "    for (vma = mm->mmap; vma; vma = vma->vm_next) {\n"
              "        if (vma->vm_file) {\n"
              "            char *path_str = d_path(&vma->vm_file->f_path, page_buf, PAGE_SIZE);\n"
              "            if (!IS_ERR(path_str)) {\n"
              "                if (strstr(path_str, \"/data/app/\") && strstr(path_str, \".apk\")) {\n"
              "                    strncpy(apk_path, path_str, sizeof(apk_path) - 1);\n"
              "                    apk_path[sizeof(apk_path) - 1] = '\\0';\n"
              "                    if (is_manager_apk(apk_path)) {\n"
              "                        verified = true;\n"
              "                        break;\n"
              "                    }\n"
              "                }\n"
              "            }\n"
              "        }\n"
              "    }\n"
              "    up_read(&mm->mmap_sem);\n"
              "    if (!verified && mm->exe_file) {\n"
              "        char *path_str = d_path(&mm->exe_file->f_path, page_buf, PAGE_SIZE);\n"
              "        if (!IS_ERR(path_str) && strstr(path_str, \"/data/app/\")) {\n"
              "            char *lib_pos = strstr(path_str, \"/lib/\");\n"
              "            if (lib_pos) {\n"
              "                size_t dir_len = lib_pos - path_str;\n"
              "                if (dir_len + 10 < sizeof(apk_path)) {\n"
              "                    memcpy(apk_path, path_str, dir_len);\n"
              "                    strcpy(apk_path + dir_len, \"/base.apk\");\n"
              "                    if (is_manager_apk(apk_path)) {\n"
              "                        verified = true;\n"
              "                    }\n"
              "                }\n"
              "            }\n"
              "        }\n"
              "    }\n"
              "    free_page((unsigned long)page_buf);\n"
              "    if (verified) {\n"
              "        ksu_manager_appid = uid % 100000;\n"
              "        pr_info(\"KernelSU: Cryptographically verified Manager! appid=%d\\n\", ksu_manager_appid);\n"
              "        return true;\n"
              "    }\n"
              "    return false;\n"
              "}\n\n"
              "static long ksu_reboot_sc_ioctl(struct file *filp, unsigned int cmd, unsigned long arg) {\n"
              "    return ksu_supercall_handle_ioctl(filp, cmd, (void __user *)arg);\n"
              "}\n\n"
              "static const struct file_operations ksu_reboot_sc_fops = {\n"
              "    .owner = THIS_MODULE,\n"
              "    .unlocked_ioctl = ksu_reboot_sc_ioctl,\n"
              "    .compat_ioctl = ksu_reboot_sc_ioctl,\n"
              "};\n\n"
              "int ksu_handle_reboot_supercall(void __user *arg);\n"
              "int ksu_handle_reboot_supercall(void __user *arg) {\n"
              "    uid_t uid = current_uid().val;\n"
              "    if (uid >= 10000) {\n"
              "        if (ksu_manager_appid != uid % 100000) {\n"
              "            if (!ksu_verify_caller_signature(uid)) {\n"
              "                pr_warn(\"KernelSU: Untrusted app (uid=%d) supercall rejected\\n\", uid);\n"
              "                return -EPERM;\n"
              "            }\n"
              "        }\n"
              "    } else if (uid != 0) {\n"
              "        return -EPERM;\n"
              "    }\n"
              "    int fd = get_unused_fd_flags(O_CLOEXEC);\n"
              "    struct file *filp;\n"
              "    if (fd < 0) return fd;\n"
              "    filp = anon_inode_getfile(\"[ksu_sc]\", &ksu_reboot_sc_fops, NULL, O_RDWR);\n"
              "    if (IS_ERR(filp)) {\n"
              "        put_unused_fd(fd);\n"
              "        return PTR_ERR(filp);\n"
              "    }\n"
              "    fd_install(fd, filp);\n"
              "    if (arg) {\n"
              "        if (copy_to_user(arg, &fd, sizeof(fd))) {\n"
              "            return -EFAULT;\n"
              "        }\n"
              "        return 0;\n"
              "    }\n"
              "    return fd;\n"
              "}\n"
          )
          for d_file in get_files("**/supercall/dispatch.c"):
              with open(d_file, "a") as f:
                  f.write(bridge_code)
                  print(f"[OK] Kriptografik Supercall Köprüsü dispatch.c içine eklendi: {d_file}")

          reboot_c = "kernel/reboot.c"
          if os.path.exists(reboot_c):
              with open(reboot_c, "r") as f: rc = f.read()
              hook_str = (
                  "\n#if defined(CONFIG_KSU)\n"
                  "    if ((unsigned int)magic1 == 0xdeadbeef && (unsigned int)magic2 == 0xcafebabe) {\n"
                  "        extern int ksu_handle_reboot_supercall(void __user *arg);\n"
                  "        return ksu_handle_reboot_supercall(arg);\n"
                  "    }\n"
                  "#endif\n"
              )
              if "ksu_handle_reboot_supercall" not in rc:
                  target_pos = rc.find("SYSCALL_DEFINE4(reboot")
                  if target_pos != -1:
                      brace_pos = rc.find("{", target_pos)
                      if brace_pos != -1:
                          rc = rc[:brace_pos+1] + hook_str + rc[brace_pos+1:]
                          with open(reboot_c, "w") as f: f.write(rc)
                          print("[OK] kernel/reboot.c kancası yerleştirildi!")
          EOF
          python3 patch_sukisu_compat.py

      - name: Setup Configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/android-kernel"

          DEFCONFIG_FILE="arch/arm64/configs/${DEVICE}_defconfig"

          {
            echo "CONFIG_OVERLAY_FS=y"
            echo "CONFIG_KALLSYMS=y"
            echo "CONFIG_KALLSYMS_ALL=y"
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_MANUAL_HOOK=y"
            echo "CONFIG_KPM=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
            echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
          } >> "$DEFCONFIG_FILE"

          make ARCH=arm64 O=out "${DEVICE}_defconfig"

          ./scripts/config --file out/.config --disable CONFIG_CC_STACKPROTECTOR_STRONG
          ./scripts/config --file out/.config --disable CONFIG_CC_WERROR

          make ARCH=arm64 O=out olddefconfig

          grep -E "^CONFIG_KSU=y" out/.config || (echo "HATA: CONFIG_KSU defconfig tarafından silindi!" && exit 1)

      - name: Build Raw Kernel Image
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/android-kernel"
          export PATH="$GITHUB_WORKSPACE/kernel_workspace/clang/bin:$PATH"

          make -j"$(nproc --all)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-typedef-redefinition" \
            Image

          if strings out/arch/arm64/boot/Image | grep -q "ksu_sys_fstat"; then
            echo "HATA: ksu_sys_fstat hala kernel içinde mevcut!"
            exit 1
          else
            echo "[OK] Doğrulama başarılı: Dinamik kancalar temizlendi."
          fi

      - name: Patch SukiSU Ultra KPM
        shell: bash
        run: |
          set -euo pipefail
          OUT_BOOT="$GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/arch/arm64/boot"
          if [[ "${{ env.KPM_SUPPORT }}" == "true" ]]; then
            mkdir -p "$GITHUB_WORKSPACE/kernel_workspace/SukiSU-Patch"
            cd "$GITHUB_WORKSPACE/kernel_workspace/SukiSU-Patch"

            wget -nv -O patch_linux "${{ env.KPM_URL }}" || wget -nv "${{ env.KPM_URL }}"
            chmod +x patch_linux
            cp "$OUT_BOOT/Image" .

            ./patch_linux

            if [[ -f oImage ]]; then
              echo "KPM injection successful!"
              gzip -c oImage > "$OUT_BOOT/Image.gz"
            else
              echo "Error: patch_linux oImage üretemedi!"
              exit 1
            fi
          else
            gzip -c "$OUT_BOOT/Image" > "$OUT_BOOT/Image.gz"
          fi

      - name: Prepare AnyKernel3
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"
          git clone "${{ env.ANYKERNEL3_SOURCE }}" -b "${{ env.ANYKERNEL3_BRANCH }}" --depth=1 AnyKernel3

          sed -i -E 's|^[# ]*do\.devicecheck=.*|do.devicecheck=0|g' AnyKernel3/anykernel.sh
          sed -i -E 's|^[# ]*block=.*|block=/dev/block/mmcblk0p34;|g' AnyKernel3/anykernel.sh
          sed -i -E 's|^[# ]*BLOCK=.*|BLOCK=/dev/block/mmcblk0p34;|g' AnyKernel3/anykernel.sh
          sed -i -E 's|^[# ]*is_slot_device=.*|is_slot_device=0;|g' AnyKernel3/anykernel.sh
          sed -i -E 's|^[# ]*IS_SLOT_DEVICE=.*|IS_SLOT_DEVICE=0;|g' AnyKernel3/anykernel.sh

          cp android-kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
          rm -rf AnyKernel3/.git* AnyKernel3/README.md

      - name: Upload SukiSU AnyKernel3 Package
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Ultra-Lancelot-LOS20-${{ env.BUILD_TIME }}
          path: kernel_workspace/AnyKernel3/*
