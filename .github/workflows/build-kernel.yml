name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      select_device:
        description: 'Select device:'
        required: true
        type: choice
        options:
          - lancelot
          - merlin

jobs:
  build:
    name: Build SukiSU Ultra + KPM
    runs-on: ubuntu-22.04
    env:
      DEVICE: ${{ github.event.inputs.select_device }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "config-suki.env" ]]; then
            grep -v -E "^#|^[[:space:]]*$" "config-suki.env" | sed 's/ #.*//; s/#.*//' >> "$GITHUB_ENV"
          else
            echo "config-suki.env bulunamadı!"; exit 1
          fi

      - name: Setup build tools
        shell: bash
        run: |
          set -euo pipefail
          echo "BUILD_TIME=$(date '+%Y%m%d%H%M')" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential curl flex git git-lfs libelf-dev libssl-dev \
            lzop zip python3 python-is-python3 tar xz-utils libncurses5-dev
          mkdir -p "$GITHUB_WORKSPACE/kernel_workspace"

      - name: Download Proton Clang
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"
          wget -nv --timeout=120 -O clang.tar.gz "${{ env.CLANG_SOURCE }}"
          mkdir -p clang
          tar -C clang/ -zxvf clang.tar.gz --strip-components=1
          rm clang.tar.gz
          rm -f clang/bin/ld

      - name: Download LineageOS 20 Kernel Source
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"
          git clone --recursive "${{ env.KERNEL_SOURCE }}" -b "${{ env.KERNEL_SOURCE_BRANCH }}" android-kernel --depth=1

      - name: Apply KernelSU 4.14 Manual Hooks
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/android-kernel"

          if [[ -f "$GITHUB_WORKSPACE/patches/KSU_HOOKS_PATCH.patch" ]]; then
            git apply "$GITHUB_WORKSPACE/patches/KSU_HOOKS_PATCH.patch" || true
            echo "KSU_HOOKS_PATCH.patch işlendi."
          fi

      - name: Setup SukiSU Ultra (SUSFS) Driver
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/android-kernel"

          curl -LSs "${{ env.KERNELSU_SETUP_SOURCE }}" | bash -s "${{ env.KERNELSU_TAG }}" || true

          if [ -d "KernelSU/kernel" ] && [ ! -d "drivers/kernelsu" ]; then
            ln -sfn ../KernelSU/kernel drivers/kernelsu
          fi

          for kcfg in drivers/kernelsu/Kconfig KernelSU/kernel/Kconfig; do
            if [ -f "$kcfg" ]; then
              sed -i '/depends on.*KPROBES/s/^/# /' "$kcfg" || true
              sed -i '/depends on.*OVERLAY_FS/s/^/# /' "$kcfg" || true
              echo "[OK] $kcfg bağımlılık engelleri kaldırıldı."
            fi
          done

          sed -i '/kernelsu\/Kconfig/d' drivers/Kconfig
          sed -i '/KernelSU\/Kconfig/d' drivers/Kconfig
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

          if ! grep -q "kernelsu" drivers/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          fi

          cat << 'EOF' > patch_compat.py
          import glob, os, re

          def read_write(path_pattern, modifier):
              for p in set(glob.glob(path_pattern, recursive=True)):
                  rp = os.path.realpath(p)
                  if not os.path.isfile(rp): continue
                  with open(rp, 'r') as f: content = f.read()
                  new_content = modifier(content)
                  if new_content != content:
                      with open(rp, 'w') as f: f.write(new_content)

          # 1. Global kernel macro shims
          with open("include/linux/compiler.h", "a") as f:
              f.write("\n#ifndef fallthrough\n#define fallthrough do {} while (0)\n#endif\n")
          with open("include/linux/task_work.h", "a") as f:
              f.write("\n#ifndef TWA_RESUME\n#define TWA_NONE 0\n#define TWA_RESUME 1\n#define TWA_SIGNAL 2\n#endif\n")
          with open("include/linux/uaccess.h", "a") as f:
              f.write("\n#ifndef copy_from_user_nofault\n#define copy_from_user_nofault(d,s,n) copy_from_user(d,(const void __user *)(s),n)\n#define copy_to_user_nofault(d,s,n) copy_to_user((void __user *)(d),s,n)\n#define strncpy_from_user_nofault(d,s,n) strncpy_from_user(d,(const char __user *)(s),n)\n#endif\n")

          # 2. Virtual compatibility headers
          sh_map = {
              "include/linux/set_memory.h": "#ifndef _SET_MEM_H\n#define _SET_MEM_H\n#include <asm/set_memory.h>\n#endif\n",
              "include/linux/pgtable.h": "#ifndef _PGTABLE_H\n#define _PGTABLE_H\n#include <asm/pgtable.h>\n#endif\n",
              "include/uapi/linux/mount.h": "#ifndef _UAPI_MOUNT_H\n#define _UAPI_MOUNT_H\n#include <linux/mount.h>\n#include <uapi/linux/fs.h>\n#endif\n"
          }
          for p, h in sh_map.items():
              os.makedirs(os.path.dirname(p), exist_ok=True)
              if not os.path.exists(p):
                  with open(p, "w") as f: f.write(h)

          # 3. Type shims & stubs
          fn_t = "#ifndef _SUKISU_FN_T\n#define _SUKISU_FN_T\nstruct pt_regs;\ntypedef long (*syscall_fn_t)(const struct pt_regs *);\n#endif\n"
          read_write("**/syscall_hook.h", lambda c: fn_t + c if "_SUKISU_FN_T" not in c else c)
          read_write("arch/arm64/include/asm/syscall.h", lambda c: fn_t + c if "_SUKISU_FN_T" not in c else c)
          read_write("**/core/init.c", lambda c: "#ifndef MODULE_IMPORT_NS\n#define MODULE_IMPORT_NS(ns)\n#endif\n" + c if "MODULE_IMPORT_NS" not in c else c)
          read_write("**/hook/lsm_hook.c", lambda c: "int ksu_lsm_hook_init(void){return 0;}\nvoid ksu_lsm_hook_exit(void){}\n")
          read_write("**/manager/pkg_observer.c", lambda c: "int ksu_pkg_observer_init(void){return 0;}\nvoid ksu_pkg_observer_exit(void){}\n")

          # 4. KSU general syscall & symbol compatibility
          def ksu_generic(c):
              c = c.replace("copy_from_user_nofault", "copy_from_user")
              c = c.replace("copy_to_user_nofault", "copy_to_user")
              c = c.replace("strncpy_from_user_nofault", "strncpy_from_user")
              c = c.replace("ksys_close", "sys_close")
              c = c.replace("ksys_unshare", "sys_unshare")
              c = c.replace("__flush_icache_range", "flush_icache_range")
              c = c.replace("copy_to_kernel_nofault", "probe_kernel_write")
              c = re.sub(r'.*filter_count.*', '// filter_count', c)
              return c
          read_write("drivers/kernelsu/**/*.c", ksu_generic)
          read_write("KernelSU/**/*.c", ksu_generic)

          # 5. Specific subsystems
          read_write("**/patch_memory.c", lambda c: "#include <linux/uaccess.h>\n#include <asm/cacheflush.h>\n#ifndef __pte_to_phys\n#define __pte_to_phys(p) ((phys_addr_t)pte_pfn(p)<<PAGE_SHIFT)\n#endif\n" + c)
          read_write("drivers/kernelsu/policy/*.c", lambda c: "#include <linux/sched/task.h>\n" + c)
          read_write("KernelSU/kernel/policy/*.c", lambda c: "#include <linux/sched/task.h>\n" + c)
          read_write("**/event_queue.*", lambda c: "#include <linux/poll.h>\n#include <uapi/linux/eventpoll.h>\ntypedef unsigned int __poll_t;\n#define EPOLLIN 1\n#define EPOLLHUP 0x10\n#define EPOLLRDNORM 0x40\n" + c)
          read_write("**/seccomp_cache.*", lambda c: "#include <asm/unistd.h>\n#define SECCOMP_ARCH_NATIVE_NR __NR_syscalls\n" + c)

          # 6. SELinux: ONLY inject into SukiSU tree
          sel_head = "struct task_security_struct;\n#ifndef selinux_cred\n#define selinux_cred(c) ((struct task_security_struct *)(c)->security)\n#endif\n"
          read_write("drivers/kernelsu/selinux/*.c", lambda c: sel_head + c)
          read_write("KernelSU/kernel/selinux/*.c", lambda c: sel_head + c)

          # 7. file_wrapper 4.14 VFS shim
          fw_shim = """#ifndef _FW_414
          #define _FW_414
          #include <linux/version.h>
          #include <linux/fs.h>
          #include <linux/file.h>
          #include <linux/dcache.h>
          #include <linux/mount.h>
          #include <linux/err.h>
          typedef unsigned int __poll_t;
          #define security_inode_init_security_anon(i,n,c) (0)
          #define selinux_inode(i) ((struct inode_security_struct *)(i)->i_security)
          static inline struct file *alloc_file_pseudo(struct inode *i, struct vfsmount *m, const char *n, int f, const struct file_operations *fops) {
              struct qstr s = QSTR_INIT(n, strlen(n));
              struct path p = { .dentry = d_alloc_pseudo(m->mnt_sb, &s), .mnt = mntget(m) };
              if (!p.dentry) { iput(i); return ERR_PTR(-ENOMEM); }
              d_instantiate(p.dentry, i);
              return alloc_file(&p, (fmode_t)f, fops);
          }
          #endif
          """
          def fw_fix(c):
              lines = []
              skip = False
              for l in c.splitlines(True):
                  if any(x in l for x in ["->ops.iopoll", "->ops.mmap_supported_flags", "->ops.remap_file_range", "->ops.fadvise"]):
                      lines.append("// " + l)
                  elif any(x in l for x in ["ksu_wrapper_iopoll(", "ksu_wrapper_remap_file_range(", "ksu_wrapper_fadvise("]):
                      skip = True
                  elif skip:
                      if l.startswith("}"): skip = False
                  else:
                      lines.append(l)
              return fw_shim + "".join(lines)
          read_write("**/file_wrapper.c", fw_fix)
          EOF
          python3 patch_compat.py

      - name: Setup Configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/android-kernel"

          DEFCONFIG_FILE="arch/arm64/configs/${DEVICE}_defconfig"

          {
            echo "CONFIG_OVERLAY_FS=y"
            echo "CONFIG_KALLSYMS=y"
            echo "CONFIG_KALLSYMS_ALL=y"
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_MANUAL_HOOK=y"
            echo "CONFIG_KPM=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
            echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
          } >> "$DEFCONFIG_FILE"

          make ARCH=arm64 O=out "${DEVICE}_defconfig"
          ./scripts/config --file out/.config --disable CONFIG_CC_STACKPROTECTOR_STRONG
          ./scripts/config --file out/.config --disable CONFIG_CC_WERROR
          make ARCH=arm64 O=out olddefconfig

          grep -E "^CONFIG_KSU=y" out/.config || (echo "HATA: CONFIG_KSU defconfig tarafından silindi!" && exit 1)

      - name: Build Raw Kernel Image
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/android-kernel"
          export PATH="$GITHUB_WORKSPACE/kernel_workspace/clang/bin:$PATH"

          make -j"$(nproc --all)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image

      - name: Patch SukiSU Ultra KPM
        shell: bash
        run: |
          set -euo pipefail
          OUT_BOOT="$GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/arch/arm64/boot"
          if [[ "${{ env.KPM_SUPPORT }}" == "true" ]]; then
            mkdir -p "$GITHUB_WORKSPACE/kernel_workspace/SukiSU-Patch"
            cd "$GITHUB_WORKSPACE/kernel_workspace/SukiSU-Patch"

            wget -nv -O patch_linux "${{ env.KPM_URL }}" || wget -nv "${{ env.KPM_URL }}"
            chmod +x patch_linux
            cp "$OUT_BOOT/Image" .

            ./patch_linux

            if [[ -f oImage ]]; then
              echo "KPM injection successful!"
              gzip -c oImage > "$OUT_BOOT/Image.gz"
            else
              echo "Error: patch_linux oImage üretemedi!"
              exit 1
            fi
          else
            gzip -c "$OUT_BOOT/Image" > "$OUT_BOOT/Image.gz"
          fi

      - name: Prepare AnyKernel3
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"
          git clone "${{ env.ANYKERNEL3_SOURCE }}" -b "${{ env.ANYKERNEL3_BRANCH }}" --depth=1 AnyKernel3

          sed -i -E 's|^[# ]*do\.devicecheck=.*|do.devicecheck=0|g' AnyKernel3/anykernel.sh
          sed -i -E 's|^[# ]*block=.*|block=/dev/block/mmcblk0p34;|g' AnyKernel3/anykernel.sh
          sed -i -E 's|^[# ]*BLOCK=.*|BLOCK=/dev/block/mmcblk0p34;|g' AnyKernel3/anykernel.sh
          sed -i -E 's|^[# ]*is_slot_device=.*|is_slot_device=0;|g' AnyKernel3/anykernel.sh
          sed -i -E 's|^[# ]*IS_SLOT_DEVICE=.*|IS_SLOT_DEVICE=0;|g' AnyKernel3/anykernel.sh

          cp android-kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
          rm -rf AnyKernel3/.git* AnyKernel3/README.md

      - name: Upload SukiSU AnyKernel3 Package
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Ultra-Lancelot-LOS20-${{ env.BUILD_TIME }}
          path: kernel_workspace/AnyKernel3/*
