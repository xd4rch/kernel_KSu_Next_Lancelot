name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      select_device:
        description: 'Select device:'
        required: true
        type: choice
        options:
          - lancelot
          - merlin

jobs:
  build:
    name: Build SukiSU Ultra + KPM
    runs-on: ubuntu-22.04
    env:
      DEVICE: ${{ github.event.inputs.select_device }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "config-suki.env" ]]; then
            grep -v -E "^#|^[[:space:]]*$" "config-suki.env" | sed 's/ #.*//; s/#.*//' >> "$GITHUB_ENV"
          else
            echo "config-suki.env bulunamadı!"; exit 1
          fi

      - name: Setup build tools
        shell: bash
        run: |
          set -euo pipefail
          echo "BUILD_TIME=$(date '+%Y%m%d%H%M')" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential curl flex git git-lfs libelf-dev libssl-dev \
            lzop zip python3 python-is-python3 tar xz-utils libncurses5-dev
          mkdir -p "$GITHUB_WORKSPACE/kernel_workspace"

      - name: Download Proton Clang
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"
          wget -nv --timeout=120 -O clang.tar.gz "${{ env.CLANG_SOURCE }}"
          mkdir -p clang
          tar -C clang/ -zxvf clang.tar.gz --strip-components=1
          rm clang.tar.gz
          # Host ld'nin Ubuntu 22.04 yerel linker'ını ezmesini engelliyoruz:
          rm -f clang/bin/ld

      - name: Download LineageOS 20 Kernel Source
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"
          git clone --recursive "${{ env.KERNEL_SOURCE }}" -b "${{ env.KERNEL_SOURCE_BRANCH }}" android-kernel --depth=1

      - name: Apply KernelSU 4.14 Namespace and Manual Hooks
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/android-kernel"

          # 4.14 için namespace desteği
          if [[ -f "$GITHUB_WORKSPACE/patches/ksu_namespace_4.14.patch" ]]; then
            git apply "$GITHUB_WORKSPACE/patches/ksu_namespace_4.14.patch" || true
            echo "ksu_namespace_4.14.patch uygulandı."
          fi

          # Non-GKI 4.14 sistem çağrı kancaları (fs/exec.c, fs/open.c, drivers/Makefile)
          if [[ -f "$GITHUB_WORKSPACE/patches/KSU_HOOKS_PATCH.patch" ]]; then
            git apply "$GITHUB_WORKSPACE/patches/KSU_HOOKS_PATCH.patch" || true
            echo "KSU_HOOKS_PATCH.patch uygulandı."
          fi

      - name: Setup SukiSU Ultra (SUSFS)
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/android-kernel"

          # 1. SukiSU Ultra kaynak kodunu klonla
          curl -LSs "${{ env.KERNELSU_SETUP_SOURCE }}" | bash -s "${{ env.KERNELSU_TAG }}" || true

          # 2. Sürücüyü drivers/Makefile içerisine ZORLA bağla
          if ! grep -q "kernelsu" drivers/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
            echo "drivers/Makefile güncellendi."
          fi

          # 3. Kconfig dosyasını drivers/Kconfig içerisine ZORLA bağla
          if ! grep -q "kernelsu/Kconfig" drivers/Kconfig; then
            # 'endmenu' satırından hemen önce Kconfig kaynağını ekle
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
            echo "drivers/Kconfig güncellendi."
          fi

      - name: Setup Configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/android-kernel"
          make ARCH=arm64 O=out "${DEVICE}_defconfig"

          # SukiSU Ultra bayraklarını doğrudan .config dosyasına enjekte et
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KSU_SUSFS=y" >> out/.config
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> out/.config
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> out/.config
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> out/.config
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> out/.config
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> out/.config
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> out/.config
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> out/.config
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> out/.config
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> out/.config
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> out/.config
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> out/.config

          # KPM (patch_linux) sembol taraması için şart olan bayraklar
          ./scripts/config --file out/.config --enable CONFIG_KALLSYMS
          ./scripts/config --file out/.config --enable CONFIG_KALLSYMS_ALL

          # Clang optimizasyonları
          ./scripts/config --file out/.config --disable CONFIG_CC_STACKPROTECTOR_STRONG
          ./scripts/config --file out/.config --disable CONFIG_CC_WERROR

          # Yapılandırmayı senkronize et
          make ARCH=arm64 O=out olddefconfig

          # Kontrol: drivers/Kconfig doğru bağlandıysa CONFIG_KSU asla silinmez
          grep -E "^CONFIG_KSU=y" out/.config || (echo "HATA: CONFIG_KSU defconfig tarafından silindi!" && exit 1)
          
      - name: Build Raw Kernel Image
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/android-kernel"
          export PATH="$GITHUB_WORKSPACE/kernel_workspace/clang/bin:$PATH"

          # KPM'in yamalayabilmesi için ham 'Image' derlenir
          make -j"$(nproc --all)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image

      - name: Patch SukiSU Ultra KPM
        shell: bash
        run: |
          set -euo pipefail
          OUT_BOOT="$GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/arch/arm64/boot"
          if [[ "${{ env.KPM_SUPPORT }}" == "true" ]]; then
            mkdir -p "$GITHUB_WORKSPACE/kernel_workspace/SukiSU-Patch"
            cd "$GITHUB_WORKSPACE/kernel_workspace/SukiSU-Patch"

            wget -nv -O patch_linux "${{ env.KPM_URL }}" || wget -nv "${{ env.KPM_URL }}"
            chmod +x patch_linux
            cp "$OUT_BOOT/Image" .

            ./patch_linux

            if [[ -f oImage ]]; then
              echo "KPM injection successful!"
              # DTB birleştirmesi ASLA YAPILMAZ; sadece yamalı oImage sıkıştırılır:
              gzip -c oImage > "$OUT_BOOT/Image.gz"
            else
              echo "Error: patch_linux oImage üretemedi!"
              exit 1
            fi
          else
            gzip -c "$OUT_BOOT/Image" > "$OUT_BOOT/Image.gz"
          fi

      - name: Prepare AnyKernel3
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"
          git clone "${{ env.ANYKERNEL3_SOURCE }}" -b "${{ env.ANYKERNEL3_BRANCH }}" --depth=1 AnyKernel3

          # Cihaz kontrol kilidini kaldırıyoruz (Unsupported device hatası engellendi)
          sed -i -E 's|^[# ]*do\.devicecheck=.*|do.devicecheck=0|g' AnyKernel3/anykernel.sh

          # Kesinleşen fiziksel boot adresini yazıyoruz (OMAP ve partition hataları engellendi)
          sed -i -E 's|^[# ]*block=.*|block=/dev/block/mmcblk0p34;|g' AnyKernel3/anykernel.sh
          sed -i -E 's|^[# ]*BLOCK=.*|BLOCK=/dev/block/mmcblk0p34;|g' AnyKernel3/anykernel.sh
          sed -i -E 's|^[# ]*is_slot_device=.*|is_slot_device=0;|g' AnyKernel3/anykernel.sh
          sed -i -E 's|^[# ]*IS_SLOT_DEVICE=.*|IS_SLOT_DEVICE=0;|g' AnyKernel3/anykernel.sh

          # KPM'li saf Image.gz dosyasını kopyala (Telefonun çalışan DTB'si korunur)
          cp android-kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
          rm -rf AnyKernel3/.git* AnyKernel3/README.md

      - name: Upload SukiSU AnyKernel3 Package
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Ultra-Lancelot-LOS20-${{ env.BUILD_TIME }}
          path: kernel_workspace/AnyKernel3/*
